name: PantheonPrime Pulse — Eternal Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours as backup trigger

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install aiohttp

      - name: Run Pulse Cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
          PANTHEON_STATE_DIR: pantheon_state
        run: python pulse.py once

      - name: Commit State & Memory
        run: |
          git config --local user.email "pulse@pantheon.local"
          git config --local user.name "PantheonPrime Pulse"
          git add -A
          git commit -m "[PULSE] Cycle complete" || echo "No changes to commit"
          git push

      - name: Self-Restart
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pulse.yml/dispatches \
            -d '{"ref":"main"}'
